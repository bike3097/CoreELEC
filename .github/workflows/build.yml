name: Build CoreELEC Image (No Docker)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 扩容磁盘 + 增加 8GB 交换分区
        uses: easimon/maximize-build-space@master
        with:
          root_reserve_mb: '10000'
          swap_size_mb: '8192'

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc g++ bison flex libssl-dev libncurses5-dev \
            libbz2-dev libreadline-dev libelf-dev liblzma-dev python3 python3-pip \
            python3-setuptools python3-wheel python3-dev unzip wget curl

      - name: 拉取 CoreELEC 源码
        uses: actions/checkout@v4
        with:
          repository: CoreELEC/CoreELEC
          ref: coreelec-21-cpm
          path: CoreELEC

      - name: 编译 CoreELEC（限制 2 线程）
        run: |
          cd CoreELEC
          PROJECT=Amlogic-ce DEVICE=AMLGX ARCH=arm64 make -j2

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-Image
          path: CoreELEC/target/*.img.gz
        if: success()
