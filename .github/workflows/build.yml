name: Build CoreELEC Image
on:
  workflow_dispatch: # 手动触发，避免误跑

jobs:
  build:
    runs-on: ubuntu-latest
    # 解决 Node.js 20 警告，提前切换到 Node.js 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 扩容磁盘 + 增加 8GB 交换分区（解决磁盘/内存不足）
        uses: easimon/maximize-build-space@master
        with:
          root_reserve_mb: '10000'
          swap_size_mb: '8192'

      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 用官方 Docker 镜像编译 CoreELEC（限制线程防OOM）
        run: |
          docker pull coreelec/coreelec-builder:latest
          docker run -v $(pwd):/build -h coreelec coreelec/coreelec-builder:latest /bin/bash -c "
            cd /build
            # 克隆最新源码（已有源码可删除此步）
            git clone --depth=1 https://github.com/CoreELEC/CoreELEC.git
            cd CoreELEC
            # 关键：-j2 限制 2 线程编译，避免内存溢出
            PROJECT=Amlogic-ce DEVICE=AMLGX ARCH=arm64 ./build -j2
          "

      - name: 上传编译产物（仅成功时执行）
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-Image
          path: |
            CoreELEC/target/*.img.gz
            CoreELEC/target/*.img
        if: success()
